{% extends "base.html" %}

{% block content %}

<section class="report-header">

    <h1>Report an Issue</h1>

    <p>
        Help improve your community by reporting civic issues quickly and accurately.
    </p>

</section>

<div class="report-container">

<form method="POST" class="report-form" autocomplete="off">

    <div class="form-group">

        <label for="name">Your Name</label>

        <input
            id="name"
            type="text"
            name="name"
            placeholder="e.g. Lionel Messi"
            required
        >

    </div>

    <div class="form-group">

        <label for="location">Location</label>

        <input
            id="location"
            type="text"
            name="location"
            placeholder="e.g. MG Road, Kochi"
            required
        >

    </div>

    <div class="form-group">

        <label for="title">Issue Title</label>

        <input
            id="title"
            type="text"
            name="title"
            placeholder="e.g. Pothole on Main Road"
            required
        >

    </div>

    <div class="form-group">

        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
            rows="6"
            placeholder="Provide a clear description of the issue..."
            required
        ></textarea>

    </div>

    <button type="submit" class="submit-btn">
        Submit Report
    </button>

</form>
</div>

{% endblock %}
