<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicBridge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            🌉 <span>CivicBridge</span>

        </div>

        <ul class="nav-links">

    <li>
        <a href="/"
           class="{% if request.endpoint == 'home' %}active{% endif %}">
            Home
        </a>
    </li>

    <li>
        <a href="/report"
           class="{% if request.endpoint == 'report' %}active{% endif %}">
            Report Issue
        </a>
    </li>

    <li>
        <a href="/issues"
           class="{% if request.endpoint == 'issues' %}active{% endif %}">
            View Issues
        </a>
    </li>

    <li>
        <a href="/about"
           class="{% if request.endpoint == 'about' %}active{% endif %}">
            About
        </a>
    </li>

</ul>

    </nav>

</header>

<main>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="flash-container">

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</main>

<footer>

    <p>© 2026 CivicBridge | Report. Track. Resolve.</p>

</footer>

</body>

</html>
